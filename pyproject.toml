[build-system]
requires = ["setuptools==75.3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "onedrive-central-backup"
version = "0.10.0"
description = "Resumable Microsoft Graph incremental backup to a mounted disk"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
onedrive-backup = "onedrive_backup.cli:main"

[tool.setuptools.packages.find]
include = ["onedrive_backup*"]
